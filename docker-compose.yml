version: '3.8'

services:
  api-service:
    image: swift-deploy-1-node:latest
    environment:
      - MODE=canary
      - APP_PORT=3000
      - APP_VERSION=1.0.0
    networks:
      - swiftdeploy-net
    restart: always
    # Security: Non-root user
    user: "1001"
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - app_logs:/app/logs

  nginx:
    image: nginx:latest
    ports:
      - "8080:8080"
    depends_on:
      - api-service
    networks:
      - swiftdeploy-net
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

networks:
  swiftdeploy-net:
    driver: bridge

volumes:
  app_logs: